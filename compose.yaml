name: smartorder
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: smartorder
      POSTGRES_USER: smartorder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U smartorder -d smartorder']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://smartorder:${POSTGRES_PASSWORD}@db:5432/smartorder
      MIGRATION_DATABASE_URL: ''
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      COOKIE_SECURE: 'false'
      SEED_DEMO: 'false'
      ENABLE_DEMO_LINK: ${ENABLE_DEMO_LINK:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    command: [sh, -c, 'python -m app.manage migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log']
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests:ro
      - ./backend/pytest.ini:/app/pytest.ini:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: 'true'
      VITE_API_BASE_URL: /api
    command: [sh, scripts/docker-dev.sh]
    ports:
      - '${FRONTEND_BIND:-127.0.0.1}:5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
  frontend_node_modules:
